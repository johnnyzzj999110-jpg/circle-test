<!DOCTYPE html>
<html lang="zh-CN">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Circle</title>
	<style>
		html {
			background: #fff;
		}

		body {
			height: 300vh;
			margin: 0;
		}

		.circle {
			position: fixed;
			inset: 0;
			width: 100%;
			height: 100%;
			pointer-events: none;
		}
	</style>
</head>
<body>
	<svg class="circle" aria-hidden="true">
		<path fill="black" />
	</svg>
	<script>
		const circle = document.querySelector('.circle');
		const shape = circle.querySelector('path');
		let ticking = false;
		let mouseX = null;
		let mouseY = null;

		function updateCircle() {
			const scrollRange = document.documentElement.scrollHeight - window.innerHeight;
			const progress = scrollRange > 0 ? Math.min(Math.max(window.scrollY / scrollRange, 0), 1) : 0;
			const centerX = Math.min(Math.max(mouseX ?? window.innerWidth / 2, 0), window.innerWidth);
			const centerY = Math.min(Math.max(mouseY ?? window.innerHeight / 2, 0), window.innerHeight);
			const maxDiameter = 2 * Math.hypot(window.innerWidth, window.innerHeight) + 2;
			const radius = maxDiameter * progress ** 2 / 2;
			const left = Math.max(0, centerX - radius);
			const right = Math.min(window.innerWidth, centerX + radius);
			const top = Math.max(0, centerY - radius);
			const bottom = Math.min(window.innerHeight, centerY + radius);
			const contactLength = (distance) => Math.sqrt(Math.max(0, radius ** 2 - distance ** 2));
			const topContact = contactLength(centerY);
			const bottomContact = contactLength(window.innerHeight - centerY);
			const leftContact = contactLength(centerX);
			const rightContact = contactLength(window.innerWidth - centerX);
			const topLeft = Math.max(left, centerX - topContact);
			const topRight = Math.min(right, centerX + topContact);
			const bottomLeft = Math.max(left, centerX - bottomContact);
			const bottomRight = Math.min(right, centerX + bottomContact);
			const leftTop = Math.max(top, centerY - leftContact);
			const leftBottom = Math.min(bottom, centerY + leftContact);
			const rightTop = Math.max(top, centerY - rightContact);
			const rightBottom = Math.min(bottom, centerY + rightContact);
			const curve = 0.5522847498;
			shape.setAttribute('d', `
				M ${topLeft} ${top} H ${topRight}
				C ${topRight + (right - topRight) * curve} ${top}, ${right} ${rightTop - (rightTop - top) * curve}, ${right} ${rightTop}
				V ${rightBottom}
				C ${right} ${rightBottom + (bottom - rightBottom) * curve}, ${bottomRight + (right - bottomRight) * curve} ${bottom}, ${bottomRight} ${bottom}
				H ${bottomLeft}
				C ${bottomLeft - (bottomLeft - left) * curve} ${bottom}, ${left} ${leftBottom + (bottom - leftBottom) * curve}, ${left} ${leftBottom}
				V ${leftTop}
				C ${left} ${leftTop - (leftTop - top) * curve}, ${topLeft - (topLeft - left) * curve} ${top}, ${topLeft} ${top} Z
			`);
			ticking = false;
		}

		function scheduleUpdate() {
			if (!ticking) {
				window.requestAnimationFrame(updateCircle);
				ticking = true;
			}
		}

		window.addEventListener('scroll', scheduleUpdate, { passive: true });
		window.addEventListener('mousemove', (event) => {
			mouseX = event.clientX;
			mouseY = event.clientY;
			scheduleUpdate();
		});
		window.addEventListener('resize', scheduleUpdate);
		updateCircle();
	</script>
</body>
</html>
